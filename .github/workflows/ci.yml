name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

jobs:
  template:
    name: Test CI template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependency
        run: python3 -m pip install PyYAML
      - name: Check maintenance scripts
        run: |
          bash -n scripts/check-plugin-ci.sh
          shellcheck scripts/check-plugin-ci.sh
          python3 -m unittest discover -s scripts/tests -v

  drift:
    name: Check ${{ matrix.plugin }} workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - DankAIUsage
          - DankCalendar
          - DankDiskUsage
          - DankDisplayControl
          - DankQuickSearch
          - DankSession
          - DankSpotify
          - DankTranslate
          - DankVault
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.plugin }}
          ref: dev
          path: ${{ matrix.plugin }}
      - name: Check canonical workflow
        run: bash scripts/check-plugin-ci.sh '${{ matrix.plugin }}'
