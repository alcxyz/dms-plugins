name: Update flake inputs

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:        # allow manual runs

jobs:
  update:
    name: Update, verify, and promote plugin inputs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update all flake inputs
        run: |
          nix flake update
          nix flake check --no-build

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified lock update to dev
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git push origin HEAD:dev

      - name: Promote dev to main
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create \
              --base main \
              --head dev \
              --title "chore: update flake inputs" \
              --body "Automated, Nix-verified promotion of released plugin source revisions.")
            pr_number=${pr_url##*/}
          fi

          gh pr merge "$pr_number" --merge
